<style>

.back{background:none;border:0;color:var(--ac);font-weight:600;padding:8px 0;min-height:44px;cursor:pointer}

1:{ru:"Present continuous описывает действие, которое происходит прямо сейчас или в этот период и ещё не закончено. Также им говорят о временных ситуациях и об изменениях, которые идут сейчас. Состояния (know, like, want) обычно не употребляются в continuous.",en:"We use the present continuous for actions happening now or around now. The action is not finished. We also use it for temporary situations and for changes in progress. State verbs (know, like, want) are not normally used in the continuous.",f:["+ : Subject + am/is/are + verb-ing","− : Subject + am/is/are + not + verb-ing","? : Am/Is/Are + subject + verb-ing?"],ex:[["She’s cooking dinner at the moment.","Она сейчас готовит ужин."],["I’m reading a good book this week.","На этой неделе я читаю хорошую книгу."],["The weather is getting warmer.","Погода становится теплее."],["Are you listening to me?","Ты меня слушаешь?"]],m:["I am knowing the answer.","I know the answer.","know — глагол состояния, continuous с ним не используется."],

function row(u){const has=!!L[u[0]],s=status(u[0]);return`<button class="ui" data-open="${u[0]}"><span class="num">${u[0]}</span><span>${u[1]}<br><span class="mut">${u[2]}${has?"":" · скоро"}</span></span><span class="chip ${SL[s][1]}">${SL[s][0]}</span></button>`}
function lib(){const q=f.q.toLowerCase(),r=U.filter(u=>(!q||u[1].toLowerCase().includes(q)||String(u[0])===q)&&(!f.g||u[2]===f.g)&&(!f.s||status(u[0])===f.s));
return`<h1>Библиотека</h1><p class="mut">Порядок и названия — как в учебнике. Готовы уроки 1–2; остальные ждут наполнения.</p>
<div class="card glass"><input type="search" id="q" placeholder="Название или номер Unit" value="${f.q.replace(/"/g,"&quot;")}" aria-label="Поиск"><div class="row" style="margin-top:8px"><select id="g" aria-label="Раздел"><option value="">Все разделы</option>${G.map(g=>`<option ${f.g===g?"selected":""}>${g}</option>`).join("")}</select><select id="s" aria-label="Статус"><option value="">Любой статус</option>${Object.entries(SL).map(([k,v])=>`<option value="${k}" ${f.s===k?"selected":""}>${v[0]}</option>`).join("")}</select></div></div>
<div id="list">${r.length?r.map(row).join(""):'<p class="mut">Ничего не найдено. Сбросьте фильтры.</p>'}</div>`}
function par(t){return`<p>${t}</p>`}
function theory(l){const r=`<h3>Объяснение (RU)</h3>${par(l.ru)}`,e=`<h3>Explanation (EN)</h3>${par(l.en)}`;return S.lang==="RU"?r:S.lang==="EN"?e:`<div class="both"><div>${e}</div><div>${r}</div></div>`}
function lesson(){const u=U.find(x=>x[0]===cur),l=L[cur];
const head=`<button class="back" data-v="lib">← Библиотека</button><h1>Unit ${u[0]}. ${u[1]}</h1><p class="mut">${u[2]}</p>`;
if(!l)return head+`<div class="card glass"><h3>Урок ещё не написан</h3><p class="mut">Этот Unit есть в реестре, но теории и упражнений пока нет. Статус: ожидает реализации.</p><button class="btn g" data-open="1">Перейти к Unit 1</button></div>`;
if(sess)return head+quiz(l);
return head+`<div class="row"><div class="seg" style="flex:1" role="group" aria-label="Язык объяснения">${["RU","EN","BOTH"].map(k=>`<button data-lang="${k}" aria-pressed="${S.lang===k}">${k}</button>`).join("")}</div></div>
<div class="card glass">${theory(l)}</div><h2>Формулы</h2>${l.f.map(x=>`<div class="formula">${x}</div>`).join("")}
<h2>Примеры</h2><div class="card glass">${l.ex.map(e=>`<div class="ex"><b>${e[0]}</b><span>${e[1]}</span></div>`).join("")}</div>
<h2>Типичная ошибка</h2><div class="card glass"><p class="bad">✕ ${l.m[0]}</p><p class="good">✓ ${l.m[1]}</p><p class="mut">${l.m[2]}</p></div>
<button class="btn" data-quiz="1" style="width:100%">Начать упражнения (${l.q.length})</button>`}
function quiz(l){if(sess.done){const c=sess.c,n=l.q.length;return`<div class="card glass"><h2>Результат: ${c} из ${n}</h2><div class="bar"><i style="width:${c/n*100}%"></i></div><p class="mut">${c===n?"Без ошибок. Тема будет возвращаться реже.":"Неверные ответы попадут в повторение: вернитесь к теории и пройдите ещё раз."}</p><div class="row"><button class="btn" data-quiz="1">Ещё раз</button><button class="btn g" data-theory="1">К теории</button></div></div>`}
const k=l.q[qi];let h=`<div class="row sp"><span class="mut">Вопрос ${qi+1} / ${l.q.length}</span></div><div class="bar"><i style="width:${qi/l.q.length*100}%"></i></div><div class="card glass"><h3>${k.q}</h3>`;
if(k.o)h+=k.o.map((o,i)=>`<button class="opt ${sess.r===undefined?"":i===k.a?"ok":i===sess.pick?"er":""}" data-pick="${i}" ${sess.r!==undefined?"disabled":""}>${o}</button>`).join("");
else h+=`<input type="search" id="ans" placeholder="Ваш ответ" autocomplete="off" autocapitalize="off" ${sess.r!==undefined?"disabled":""} value="${sess.val||""}">${sess.r===undefined?'<button class="btn" data-check="1" style="margin-top:8px">Проверить</button>':""}`;
if(sess.r!==undefined)h+=`<div class="fb ${sess.r?"ok":"er"}"><b>${sess.r?"Верно":"Неверно"}</b>${sess.r?"":" — правильно: "+(k.o?k.o[k.a]:k.t[0])}<br>${k.w}</div><div class="row" style="margin-top:10px"><button class="btn" data-next="1">${qi+1<l.q.length?"Дальше":"Завершить"}</button><button class="btn g" data-theory="1">Теория</button></div>`;
return h+"</div>"}
const norm=s=>s.toLowerCase().replace(/[’‘`]/g,"'").replace(/\s+/g," ").trim().replace(/[.!]$/,"");
function answer(ok){const p=S.p[cur]||(S.p[cur]={att:0,cor:0,ses:0,last:null});p.att++;if(ok)p.cor++;p.last=day();S.log.push({d:day(),n:cur,ok});if(S.log.length>500)S.log.shift();S.last=cur;sess.r=ok;if(ok)sess.c++;save()}
function practice(){const rev=U.filter(u=>status(u[0])==="review"&&L[u[0]]);const ids=Object.keys(L).map(Number);const pick=rev.length?rev[0][0]:ids.sort((a,b)=>((S.p[a]||{}).att||0)-((S.p[b]||{}).att||0))[0];
return`<h1>Практика</h1><div class="card glass"><h3>Ежедневная практика</h3><p class="mut">${rev.length?"Сначала — темы, где точность ниже 60%.":"Выбираем тему, где у вас меньше всего ответов."}</p><p>Unit ${pick}. ${U[pick-1][1]}</p><button class="btn" data-open="${pick}" data-go="quiz">Начать</button></div><p class="mut">Правила: «Повторить» — точность < 60%; «Освоена» — ≥ 10 ответов, ≥ 2 подходов и точность ≥ 85%.</p>`}
function settings(){return`<h1>Настройки</h1><div class="card glass"><h3>Тема</h3><div class="seg" role="group">${[["auto","Авто"],["light","Светлая"],["dark","Тёмная"]].map(([k,l])=>`<button data-theme="${k}" aria-pressed="${S.theme===k}">${l}</button>`).join("")}</div></div>
<div class="card glass"><h3>Язык объяснений</h3><div class="seg" role="group">${["RU","EN","BOTH"].map(k=>`<button data-lang="${k}" aria-pressed="${S.lang===k}">${k}</button>`).join("")}</div></div>
<div class="card glass"><h3>Цель на день</h3><select id="goal">${[5,10,20,30].map(n=>`<option ${S.goal===n?"selected":""}>${n}</option>`).join("")}</select><p class="mut">ответов в день</p></div>
<div class="card glass"><h3>Данные</h3><p class="mut">Прогресс хранится только в этом браузере.</p><button class="btn g" data-reset="1">Сбросить прогресс</button></div>`}
function draw(){nav();const m=$("#app");m.innerHTML=view==="home"?home():view==="lib"?lib():view==="lesson"?lesson():view==="pr"?practice():settings();window.scrollTo(0,0)}
function open(n,go){cur=n;sess=null;qi=0;view="lesson";S.last=S.last||n;if(go==="quiz"&&L[n])startQ();draw()}
function startQ(){sess={c:0};qi=0;const p=S.p[cur]||(S.p[cur]={att:0,cor:0,ses:0,last:null});p.ses++;save()}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset;
if(d.open)return open(+d.open,d.go);
if(d.v){view=d.v;draw();return}
if(d.lang){S.lang=d.lang;save();return draw()}
if(d.theme){S.theme=d.theme;save();setTheme();return draw()}
if(d.quiz){startQ();return draw()}
if(d.theory){sess=null;return draw()}
if(d.pick!==undefined&&sess.r===undefined){sess.pick=+d.pick;answer(sess.pick===L[cur].q[qi].a);return draw()}
if(d.check){const v=$("#ans").value;if(!v.trim()){toast("Введите ответ");return}sess.val=v;answer(L[cur].q[qi].t.map(norm).includes(norm(v)));return draw()}
if(d.next){if(qi+1<L[cur].q.length){qi++;sess.r=undefined;sess.val="";sess.pick=undefined}else sess.done=1;return draw()}
if(d.reset){if(confirm("Удалить весь прогресс? Это нельзя отменить.")){S.p={};S.log=[];S.last=null;save();toast("Прогресс сброшен");draw()}}});
document.addEventListener("input",e=>{if(e.target.id==="q"){f.q=e.target.value;$("#list").innerHTML=lib().split('<div id="list">')[1].replace(/<\/div>$/,"");}});
document.addEventListener("change",e=>{if(e.target.id==="g"){f.g=e.target.value;draw()}if(e.target.id==="s"){f.s=e.target.value;draw()}if(e.target.id==="goal"){S.goal=+e.target.value;save();toast("Сохранено")}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="ans"){document.querySelector("[data-check]")?.click()}});
setTheme();draw();
</script></body></html>
